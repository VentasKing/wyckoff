<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tap Scanner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3E%3Crect x='1' y='1' width='28' height='28' rx='7' fill='%230D1117' stroke='%234C9EFF' stroke-width='2'/%3E%3Cpath d='M6 10 L10 20 L14 12 L18 21 L23 9' stroke='%234C9EFF' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#0D1117;--panel:#11171F;--panel2:#131A22;--line:#222B36;--line2:#1C242E;--text:#E6EBF2;--muted:#9AA6B5;--soft:#C9D2DD;
  --accent:#4C9EFF;--acc:#5AA9FF;--dist:#FF9F43;--amber:#F5A524;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}
a{color:#7DB8FF}a:hover{color:#A9D0FF}
button{font:inherit;color:inherit}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;padding:14px 24px;border-bottom:1px solid var(--line);background:#10161D}
.brand{display:flex;align-items:center;gap:12px}
.brand b{font-size:17px;letter-spacing:-.01em}
.brand small{display:block;font-size:12px;color:var(--muted)}
.hright{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.scaninfo{font-size:12px;color:var(--muted);text-align:right;line-height:1.4}
.pill-ok{display:flex;align-items:center;gap:6px;font-size:12px;color:#BFE3C9;background:#13261B;border:1px solid #24503A;padding:7px 10px;border-radius:8px;text-decoration:none}
.pill-off{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--soft);background:#1A212B;border:1px solid #323D4B;padding:7px 10px;border-radius:8px;text-decoration:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:8px;border:1px solid #2B3542;background:#1E2733;color:var(--text);font-weight:600;font-size:13px;text-decoration:none;cursor:pointer}
.btn:hover{border-color:#5A6778;color:var(--text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#071220}
.btn.primary:hover{background:#6AAFFF;color:#071220}
.btn.ghost{background:transparent;color:var(--soft);font-weight:500}
.iconbtn{width:36px;padding:0}
.stats{padding:14px 24px 0;display:flex;flex-wrap:wrap;gap:12px}
.stat{flex:1 1 150px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 14px}
.stat .v{font-size:24px;font-weight:700;font-family:var(--mono);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%}
.filters{padding:12px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:16px}
.fgroup{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.fgroup>span{font-size:12px;color:var(--muted);margin-right:4px}
.chip{height:30px;padding:0 11px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid #2B3542;background:transparent;color:var(--muted)}
.chip:hover{border-color:#5A6778}
.chip[aria-pressed=true]{border-color:var(--accent);background:rgba(76,158,255,.14);color:var(--text)}
main{padding:0 24px 28px;display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.list{flex:1 1 330px;max-width:430px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.listhead{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.rows{max-height:calc(100vh - 290px);min-height:200px;overflow-y:auto}
.sig{display:block;width:100%;text-align:left;padding:12px 14px;border:0;border-bottom:1px solid var(--line2);background:transparent;cursor:pointer}
.sig:hover{background:#1A222D}
.sig[aria-current=true]{background:#18212C;box-shadow:inset 0 0 0 1px var(--accent)}
.sig .r1,.sig .r2,.sig .r3{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sig .r2,.sig .r3{margin-top:5px;font-size:12px}
.sig .r3{font-family:var(--mono);color:var(--muted)}
.sym{font-weight:700;font-size:15px}
.tf{font-size:11px;font-weight:600;color:var(--soft);background:#1E2733;padding:2px 6px;border-radius:4px;font-family:var(--mono)}
.side-a{color:var(--acc);font-size:11px}.side-d{color:var(--dist);font-size:11px}
.state{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;border:1px solid;white-space:nowrap}
.st-potential{color:#F5A524;background:#2A2111;border-color:#5C4415}
.st-confirmed{color:#7DB8FF;background:#122236;border-color:#24466E}
.st-forming{color:var(--soft);background:#1A212B;border-color:#323D4B}
.st-failed{color:#8A94A3;background:#161B22;border-color:#2B3542}
.detail{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.dhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px}
.dtitle{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.dtitle h1{margin:0;font-size:22px;letter-spacing:-.01em}
.sidepill{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;border:1px solid}
.sp-a{color:var(--acc);border-color:#24466E}.sp-d{color:var(--dist);border-color:#5C3A15}
#chart{height:430px;margin-top:14px;border-radius:8px;border:1px solid var(--line2);overflow:hidden}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.fact{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 14px}
.fact .v{margin-top:3px;font-size:15px;font-weight:600;font-family:var(--mono);word-break:break-word}
.fact .s{margin-top:2px;font-size:12px;color:var(--muted)}
.two{display:flex;flex-wrap:wrap;gap:14px}.two>*{flex:1 1 300px}
h2{margin:0 0 10px;font-size:14px}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.tl li{display:flex;gap:10px;align-items:flex-start}
.tl .d{flex:none;width:10px;height:10px;margin-top:5px;border-radius:50%;background:#3A4757}
.tl li:last-child .d{background:var(--amber);box-shadow:0 0 0 3px rgba(245,165,36,.2)}
.tl .t{font-size:13px;font-weight:600}.tl .x{font-size:12px;color:var(--muted)}
.src{padding:8px 0;border-top:1px solid var(--line2)}.src:first-of-type{border-top:0}
.src b{font-size:13px}.src div{font-size:12px;color:var(--muted);margin-top:2px}
.empty{padding:28px 16px;color:var(--muted);font-size:13px;text-align:center}
.banner{margin:12px 24px 0;padding:10px 14px;border-radius:10px;font-size:13px;border:1px solid #5C4415;background:#2A2111;color:#F3D59B}
.back{display:none}
#settings{display:none;max-width:1100px;margin:0 auto;padding:22px 24px 40px}
#settings .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:18px}
.kv{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-top:1px solid var(--line2);font-size:13px}
.kv:first-of-type{border-top:0}.kv span:last-child{text-align:right;color:var(--soft)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:12px;font-family:var(--mono);background:#1A222D;border:1px solid #2B3542;padding:3px 7px;border-radius:6px}
body.show-settings #dash{display:none}body.show-settings #settings{display:block}
.fld{padding:10px 0;border-top:1px solid var(--line2)}.fld:first-of-type{border-top:0}
.fld>label,.fld>.lbl{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.fld .help{font-size:12px;color:var(--muted);margin-top:4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:16px}
.inp,.sel{width:100%;height:38px;padding:0 10px;border-radius:8px;border:1px solid #2B3542;background:#0D1218;color:var(--text);font:13px Inter,system-ui,sans-serif}
.inp:focus,.sel:focus{outline:2px solid var(--accent);outline-offset:1px}
.num{width:90px}
.sw{flex:none;position:relative;width:44px;height:26px;border-radius:999px;border:0;cursor:pointer;background:#2B3542}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#9AA6B5;transition:left .12s}
.sw[aria-checked=true]{background:var(--accent)}.sw[aria-checked=true]::after{left:21px;background:#071220}
.tk{display:inline-flex;align-items:center;gap:2px;font-size:12px;font-family:var(--mono);background:#1A222D;border:1px solid #2B3542;padding:0 0 0 7px;border-radius:6px;height:28px}
.tk button{border:0;background:none;color:var(--muted);cursor:pointer;width:26px;height:26px;font-size:15px;line-height:1}
.tk button:hover{color:#F08C8C}
.tklist{display:flex;flex-wrap:wrap;gap:6px;max-height:190px;overflow-y:auto;padding:2px}
.addrow{display:flex;gap:8px;margin-top:8px}
.status{font-size:13px;color:var(--muted)}.status.ok{color:#8BD5A6}.status.err{color:#F08C8C}.status.warn{color:#F3D59B}
.steps{margin:8px 0 12px;padding-left:20px;font-size:13px;line-height:1.7}
.topnote{position:fixed;left:50%;top:14px;transform:translate(-50%,-150%);opacity:0;transition:transform .35s ease,opacity .35s ease;z-index:20;display:flex;align-items:center;gap:8px;
  background:#13261B;border:1px solid #24503A;color:#CFF0DA;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:0 8px 28px rgba(0,0,0,.45)}
.topnote.show{transform:translate(-50%,0);opacity:1}
.scanning{display:none;align-items:center;gap:8px;font-size:12px;color:#CFE3FF;background:#122236;border:1px solid #24466E;padding:7px 10px;border-radius:8px}
.scanning.on{display:flex}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid #4C9EFF;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.topnote{transition:none}.spin{animation:none}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1E2733;border:1px solid #2B3542;color:var(--text);padding:10px 16px;border-radius:10px;font-size:13px;z-index:10;box-shadow:0 6px 24px rgba(0,0,0,.4)}
@media (max-width:820px){
  header,.stats,.filters,main{padding-left:14px;padding-right:14px}
  .scaninfo{text-align:left}
  .list{max-width:none}
  .rows{max-height:none}
  body.has-sel .list,body.has-sel .stats,body.has-sel .filters{display:none}
  body:not(.has-sel) .detail{display:none}
  .back{display:inline-flex;align-items:center;gap:4px;min-height:44px;font-weight:600;text-decoration:none;color:#7DB8FF;background:none;border:0;cursor:pointer;padding:0}
  #chart{height:300px}
  .dhead .btns{width:100%}.dhead .btns .btn{flex:1;height:44px}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 30 30" fill="none" aria-hidden="true"><rect x="1" y="1" width="28" height="28" rx="7" stroke="#4C9EFF" stroke-width="2"/><path d="M6 10 L10 20 L14 12 L18 21 L23 9" stroke="#4C9EFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="18" cy="21" r="2.4" fill="#F5A524"/></svg>
    <div><b>Tap Scanner</b><small>Wyckoff 2nd &amp; 3rd taps · stocks &amp; Coinbase crypto</small></div>
  </div>
  <div class="hright">
    <div class="scaninfo" id="scaninfo">Loading…</div>
    <div class="scanning" id="scanning" role="status"><span class="spin" aria-hidden="true"></span>Scanning…</div>
    <a id="alertpill" class="pill-off" href="#settings">Phone alerts</a>
    <a id="scannow" class="btn primary" target="_blank" rel="noopener">Scan now ↗</a>
    <a class="btn iconbtn" href="#settings" aria-label="Settings" title="Settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </a>
  </div>
</header>

<div class="topnote" id="topnote" role="status" aria-live="polite"></div>
<div id="dash">
  <div id="banners"></div>
  <section class="stats" id="stats"></section>
  <section class="filters" aria-label="Filters">
    <div class="fgroup" id="f-market"><span>Market</span></div>
    <div class="fgroup" id="f-tf"><span>Timeframe</span></div>
    <div class="fgroup" id="f-state"><span>Tap 3</span></div>
    <div class="fgroup"><button type="button" class="chip" id="f-live" aria-pressed="true">Live only</button></div>
  </section>
  <main>
    <section class="list" aria-label="Signals">
      <div class="listhead"><div><b id="listtitle">Live setups</b> <span class="muted" id="listcount"></span></div><span class="muted" style="font-size:12px">Newest first</span></div>
      <div class="rows" id="rows"></div>
      <div id="dismissedNote" class="muted" style="font-size:12px;padding:10px 14px;display:none"></div>
    </section>
    <section class="detail" id="detail" aria-label="Selected setup"></section>
  </main>
</div>

<section id="settings" aria-label="Settings">
  <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px">
    <div style="display:flex;align-items:center;gap:14px">
      <a href="#" class="btn ghost">‹ Dashboard</a>
      <h1 style="margin:0;font-size:20px">Settings</h1>
    </div>
    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px">
      <span class="status" id="savestatus" role="status"></span>
      <button type="button" class="btn" id="savebtn" hidden>Save</button>
      <button type="button" class="btn primary" id="savescan" hidden>Save &amp; scan now</button>
    </div>
  </div>
  <div id="connect"></div>
  <div class="grid" id="cfggrid"></div>
  <p class="muted" style="font-size:12px;margin-top:16px">Settings are stored in <span class="mono">config.json</span> in your repository · <a id="editcfg" target="_blank" rel="noopener">open it on GitHub ↗</a></p>
</section>

<script>
(function () {
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } },
                  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
  const TF_ORDER = ['5m', '15m', '30m', '1h', '4h', '1D', '1W'];
  const STATES = ['potential', 'confirmed', 'forming', 'failed'];
  const NICE = { potential: 'Potential', confirmed: 'Confirmed', forming: 'Forming', failed: 'Failed' };

  // repo links (owner.github.io/repo/)
  const owner = location.hostname.endsWith('github.io') ? location.hostname.split('.')[0] : null;
  const repo = owner ? location.pathname.split('/').filter(Boolean)[0] : null;
  const gh = owner && repo ? `https://github.com/${owner}/${repo}` : null;
  $('#scannow').href = gh ? `${gh}/actions/workflows/scan.yml` : 'https://github.com';
  $('#editcfg').href = gh ? `${gh}/edit/main/config.json` : 'https://github.com';

  let DATA = null, sel = null, chart = null, DATA_LOADED_ONCE = false;
  const F = { market: 'All', tfs: null, states: { potential: true, confirmed: true, forming: true, failed: false }, live: true };
  let dismissed = new Set(store.get('dismissed', []));

  const tz = () => (DATA && DATA.config && DATA.config.display && DATA.config.display.timezone) || Intl.DateTimeFormat().resolvedOptions().timeZone;
  const fmt = (iso, opts) => iso ? new Intl.DateTimeFormat('en-US', Object.assign({ timeZone: tz() }, opts)).format(new Date(iso)) : '';
  const when = (iso) => fmt(iso, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZoneName: 'short' });
  const ago = (iso) => { const m = Math.round((Date.now() - new Date(iso)) / 60000); return m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`; };
  const num = (x) => x == null ? '—' : (Math.abs(x) >= 1000 ? x.toLocaleString('en-US', { maximumFractionDigits: 2 }) : String(+(+x).toPrecision(6)));

  let lastGen = null, scanningSince = null, pollTimer = null, noteTimer = null;

  function topnote(msg) {
    const el = $('#topnote');
    el.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>' + esc(msg);
    el.classList.add('show');
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => el.classList.remove('show'), 6000);
  }

  function setScanning(on) {
    scanningSince = on ? Date.now() : null;
    $('#scanning').classList.toggle('on', !!on);
    schedule();
  }

  // check for new results: every minute, or every 20 s while a scan we started is running
  function schedule() {
    clearTimeout(pollTimer);
    if (scanningSince && Date.now() - scanningSince > 15 * 60 * 1000) { scanningSince = null; $('#scanning').classList.remove('on'); }
    pollTimer = setTimeout(async () => { await load(); schedule(); }, scanningSince ? 20000 : 60000);
  }

  async function load() {
    let fresh = null;
    try {
      const r = await fetch('data/signals.json?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status);
      fresh = await r.json();
    } catch (e) {
      if (!DATA) DATA = { signals: [], markets: {}, config: null, generated_at: null };   // keep what's on screen
    }
    if (fresh) {
      const isNew = lastGen !== null && fresh.generated_at && fresh.generated_at !== lastGen;
      DATA = fresh;
      if (fresh.generated_at) lastGen = fresh.generated_at;
      if (!isNew && DATA_LOADED_ONCE) { refreshScanInfo(); return; }      // nothing new: don't redraw
      if (isNew) {
        const live = fresh.signals.filter((x) => x.live).length;
        const errs = Object.values(fresh.markets || {}).filter((m) => m.error && m.error_at === fresh.generated_at).length;
        topnote(`Scan complete · ${live} live setup${live === 1 ? '' : 's'}${errs ? ' · ' + errs + ' market failed' : ''}`);
        if (scanningSince) { scanningSince = null; $('#scanning').classList.remove('on'); }
      } else if (lastGen === null && !fresh.generated_at) lastGen = '';
    } else if (!fresh && DATA_LOADED_ONCE) return;
    if (!F.tfs) { F.tfs = {}; TF_ORDER.forEach((t) => (F.tfs[t] = true)); }
    if (document.body.classList.contains('show-settings') && DATA_LOADED_ONCE) return;
    DATA_LOADED_ONCE = true;
    render();
  }

  function refreshScanInfo() {
    const m = DATA.markets || {};
    const line = (k, n) => m[k] && m[k].scanned_at ? `${n} ${ago(m[k].scanned_at)}` : `${n} not scanned yet`;
    $('#scaninfo').innerHTML = DATA.generated_at
      ? `Last scan ${esc(when(DATA.generated_at))}<br>${esc(line('stocks', 'Stocks'))} · ${esc(line('crypto', 'Crypto'))}`
      : 'Waiting for the first scan';
  }

  function visible() {
    return DATA.signals.filter((s) => (F.market === 'All' || s.market === F.market.toLowerCase()) &&
      F.tfs[s.tf] !== false && F.states[s.state] && (!F.live || s.live) && !dismissed.has(s.id));
  }

  function chips(el, items) {
    el.querySelectorAll('button').forEach((b) => b.remove());
    items.forEach(([label, on, fn]) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.textContent = label; b.setAttribute('aria-pressed', on);
      b.onclick = fn; el.appendChild(b);
    });
  }

  function render() {
    // header
    const m = DATA.markets || {};
    refreshScanInfo();
    const al = DATA.config && DATA.config.alerts;
    const on = al && (al.tap3_potential || al.tap3_confirmed || al.model1_forming);
    $('#alertpill').className = on ? 'pill-ok' : 'pill-off';
    $('#alertpill').textContent = on ? 'Phone alerts on' : 'Phone alerts off';

    // banners: scan errors, closed market
    const b = [];
    for (const k of ['stocks', 'crypto']) {
      if (m[k] && m[k].error) b.push(`${k === 'stocks' ? 'Stock' : 'Crypto'} scan failed at ${esc(when(m[k].error_at))}: ${esc(m[k].error)}`);
    }
    if (m.stocks && m.stocks.skipped_at && m.stocks.scanned_at && new Date(m.stocks.skipped_at) > new Date(m.stocks.scanned_at))
      b.push(`US market is closed, so stocks show the results from ${esc(when(m.stocks.scanned_at))}.`);
    $('#banners').innerHTML = b.map((x) => `<div class="banner">${x}</div>`).join('');

    // filters
    const presentTfs = TF_ORDER.filter((t) => DATA.signals.some((s) => s.tf === t));
    chips($('#f-market'), ['All', 'Stocks', 'Crypto'].map((x) => [x, F.market === x, () => { F.market = x; render(); }]));
    chips($('#f-tf'), presentTfs.map((t) => [t, F.tfs[t] !== false, () => { F.tfs[t] = F.tfs[t] === false; render(); }]));
    chips($('#f-state'), STATES.filter((s) => s !== 'failed' || !F.live).map((s) => [NICE[s], !!F.states[s], () => { F.states[s] = !F.states[s]; render(); }]));
    $('#f-live').setAttribute('aria-pressed', F.live);
    $('#f-live').onclick = () => { F.live = !F.live; if (F.live) F.states.failed = false; render(); };

    const vis = visible();
    // stats
    const n = (st) => vis.filter((s) => s.state === st).length;
    $('#stats').innerHTML = [
      [F.live ? 'Live setups' : 'Setups', vis.length, '#4C9EFF'],
      ['Tap 3 confirmed', n('confirmed'), '#7DB8FF'],
      ['Tap 3 potential', n('potential'), '#F5A524'],
      ['Model 1 forming', n('forming'), '#C9D2DD'],
    ].map(([l, v, c]) => `<div class="stat"><div class="muted" style="font-size:12px">${l}</div><div class="v">${v}<span class="dot" style="background:${c}"></span></div></div>`).join('');

    // list
    $('#listtitle').textContent = F.live ? 'Live setups' : 'All setups (last 14 days)';
    $('#listcount').textContent = '· ' + vis.length;
    const rows = $('#rows');
    if (!DATA.generated_at) rows.innerHTML = '<div class="empty">No scan results yet. The first scan runs within 30 minutes of setup, or press “Scan now”.</div>';
    else if (!vis.length) rows.innerHTML = '<div class="empty">No setups match these filters.</div>';
    else rows.innerHTML = vis.map((s) => `
      <button type="button" class="sig" data-id="${esc(s.id)}" aria-current="${sel && sel.id === s.id}">
        <div class="r1"><span style="display:flex;align-items:center;gap:8px;min-width:0">
          <span class="${s.side === 'accumulation' ? 'side-a' : 'side-d'}">${s.side === 'accumulation' ? '▲' : '▼'}</span>
          <span class="sym">${esc(s.symbol)}</span><span class="tf">${esc(s.tf)}</span>
          <span class="muted" style="font-size:11px">${s.market === 'stocks' ? 'Stock' : 'Crypto'}</span></span>
          <span class="state st-${s.state}">${NICE[s.state]}</span></div>
        <div class="r2"><span style="color:var(--soft)">${esc(s.model_name)}${s.level_tf ? ' (' + esc(s.level_tf) + ')' : ''}</span><span class="muted">${s.bars_ago === 0 ? 'this bar' : s.bars_ago + ' bar' + (s.bars_ago === 1 ? '' : 's') + ' ago'}</span></div>
        <div class="r3"><span>${s.level != null ? 'level ' + num(s.level) : s.stop != null ? 'stop ' + num(s.stop) : ''}</span>${s.flags.length ? `<span style="color:var(--amber)">⚑ ${s.flags.length}</span>` : ''}</div>
      </button>`).join('');
    rows.querySelectorAll('.sig').forEach((el) => el.onclick = () => { location.hash = el.dataset.id; });
    const nd = DATA.signals.filter((s) => dismissed.has(s.id)).length;
    const dn = $('#dismissedNote');
    dn.style.display = nd ? 'block' : 'none';
    dn.innerHTML = nd ? `${nd} dismissed · <a href="#" id="undismiss">show again</a>` : '';
    if (nd) $('#undismiss').onclick = (e) => { e.preventDefault(); dismissed = new Set(); store.set('dismissed', []); render(); };

    // selection from hash
    const id = decodeURIComponent(location.hash.slice(1));
    document.body.classList.toggle('show-settings', id === 'settings');
    if (id === 'settings') { renderSettings(true); return; }
    const found = DATA.signals.find((s) => s.id === id);
    sel = found || (window.innerWidth > 820 ? vis[0] : null) || null;
    document.body.classList.toggle('has-sel', !!found);
    rows.querySelectorAll('.sig').forEach((el) => el.setAttribute('aria-current', !!sel && el.dataset.id === sel.id));
    renderDetail();
  }

  function renderDetail() {
    const d = $('#detail');
    if (!sel) { d.innerHTML = DATA.generated_at ? '<div class="card empty">Pick a setup to see its chart.</div>' : ''; return; }
    const s = sel, acc = s.side === 'accumulation', r = s.range;
    const flagText = { range_high_not_fresh: 'Range high already taken before tap 3', range_low_not_fresh: 'Range low already taken before tap 3',
      ar_no_break_of_structure: 'AR did not break structure', inside_larger_range: 'Inside a larger range' };
    const statusNote = s.status === 'invalidated' ? `Invalidated: ${s.invalid_reason || ''}` : s.status === 'completed' ? 'Played out: broke the opposite end' :
      s.status === 'superseded' ? 'Replaced by a newer range' : '';
    const next = s.state === 'potential' ? `Wait for a break of structure${s.level_tf ? ' on the ' + s.level_tf : ''}` :
      s.state === 'forming' ? `Watch for a close back inside the range (M1 limit ${num(r.model1_limit)})` :
      s.state === 'confirmed' ? (s.stop != null ? `Stop beyond ${num(s.stop)}` : `Invalid if price goes past tap 2 (${num(r.tap2)})`) : statusNote;
    d.innerHTML = `
      <div class="card">
        <button type="button" class="back" id="backbtn">‹ Signals</button>
        <div class="dhead">
          <div>
            <div class="dtitle"><h1>${esc(s.symbol)}</h1><span class="tf" style="font-size:12px;padding:3px 7px">${esc(s.tf)}</span>
              <span class="sidepill ${acc ? 'sp-a' : 'sp-d'}">${acc ? '▲ Accumulation' : '▼ Distribution'}</span>
              <span class="state st-${s.state}" style="font-size:12px;padding:3px 8px">Tap 3 · ${NICE[s.state]}</span></div>
            <div class="muted" style="margin-top:6px;font-size:13px">${esc(s.model_name)}${s.level_tf ? ' (' + esc(s.level_tf) + ')' : ''} · tap 3 ${esc(when(s.time))}${statusNote ? ' · <span style="color:#F08C8C">' + esc(statusNote) + '</span>' : ''}</div>
          </div>
          <div class="btns" style="display:flex;gap:8px;flex-wrap:wrap">
            <a class="btn" href="${esc(s.tv)}" target="_blank" rel="noopener">Open in TradingView ↗</a>
            <button type="button" class="btn ghost" id="dismissbtn">Dismiss</button>
          </div>
        </div>
        <div id="chart" role="img" aria-label="${esc(s.tf)} chart of ${esc(s.symbol)} with the range and taps marked"></div>
        <div class="legend">
          <span><span style="width:16px;height:2px;background:#8FB4E0"></span>Range high / low</span>
          <span><span style="width:16px;border-top:2px dotted #8A94A3"></span>EQ</span>
          <span><span style="width:16px;border-top:2px dashed #E06C6C"></span>Deviation limit</span>
          ${s.zone ? '<span><span style="width:16px;border-top:2px solid #F5A524"></span>Extreme ' + (acc ? 'demand' : 'supply') + ' zone</span>' : ''}
          ${s.liquidity ? '<span><span style="width:16px;border-top:2px dashed #B48CF2"></span>Extreme liquidity</span>' : ''}
          <span class="muted">Times in ${esc(tz())}</span>
        </div>
      </div>
      <div class="facts">
        <div class="fact"><div class="muted" style="font-size:12px">Range</div><div class="v">${num(Math.min(r.climax, r.reaction))} – ${num(Math.max(r.climax, r.reaction))}</div><div class="s">EQ ${num(r.eq)}</div></div>
        <div class="fact"><div class="muted" style="font-size:12px">Tap 2 ${acc ? 'low' : 'high'}</div><div class="v">${num(r.tap2)}</div><div class="s">${r.tap2_closed_outside ? 'Closed outside, within limit' : 'Wick only'}</div></div>
        <div class="fact"><div class="muted" style="font-size:12px">${s.level != null ? 'Level hit' : 'Tap 3 extreme / stop'}</div><div class="v">${num(s.level != null ? s.level : s.stop)}</div><div class="s">${esc(s.model_name)}</div></div>
        <div class="fact"><div class="muted" style="font-size:12px">Next</div><div class="v" style="font-family:Inter,system-ui,sans-serif;font-size:14px">${esc(next)}</div><div class="s">${s.bars_ago === 0 ? 'Tap 3 on this bar' : s.bars_ago + ' bars since tap 3'}</div></div>
      </div>
      <div class="two">
        <div class="card"><h2>How this setup formed</h2><ol class="tl">${s.timeline.map((e) =>
          `<li><span class="d"></span><div><div class="t">${esc(e.title)}</div><div class="x">${esc(e.detail)} · ${esc(when(e.time))}</div></div></li>`).join('')}</ol></div>
        <div style="display:flex;flex-direction:column;gap:14px">
          <div class="card"><h2>Where the levels came from</h2>${sources(s)}</div>
          <div class="card"><h2>Red flags</h2>${s.flags.length ? s.flags.map((f) => `<div style="display:flex;gap:8px;font-size:13px;padding:3px 0"><span style="color:var(--amber)">⚑</span>${esc(flagText[f] || f)}</div>`).join('') : '<div class="muted" style="font-size:13px">None</div>'}</div>

  function sources(s) {
    const acc = s.side === 'accumulation', out = [];
    if (s.liquidity) out.push(`<div class="src"><b>Extreme liquidity · ${esc(s.liquidity.tf)}</b><div>${num(s.liquidity.level)} — the first two-candle structure ${acc ? 'low' : 'high'} after tap 2${s.liquidity.low ? ', candle at ' + esc(when(s.liquidity.low)) : ''}</div></div>`);
    if (s.zone) out.push(`<div class="src"><b>Extreme ${acc ? 'demand' : 'supply'} · ${esc(s.zone.tf)}</b><div>${num(s.zone.lo)} – ${num(s.zone.hi)} — order block at ${esc(when(s.zone.ob))}, fair value gap completed ${esc(when(s.zone.fvg))}</div></div>`);
    if (s.model === 'model1') out.push(`<div class="src"><b>Model 1</b><div>Tap 3 deviated the tap 2 extreme (${num(s.range.tap2)}). Once confirmed, its extreme is the stop.</div></div>`);
    return out.join('') || '<div class="muted" style="font-size:13px">No Model 2 levels found for this range.</div>';
  }

  function drawChart(s) {
    const el = $('#chart');
    if (chart) { chart.remove(); chart = null; }
    if (!window.LightweightCharts) { el.innerHTML = '<div class="empty">The chart library didn’t load. Check your connection and refresh.</div>'; return; }
    const LC = window.LightweightCharts;
    const intraday = !['1D', '1W'].includes(s.tf);
    const tfmt = (t, o) => new Intl.DateTimeFormat('en-US', Object.assign({ timeZone: tz() }, o)).format(new Date(t * 1000));
    chart = LC.createChart(el, {
      autoSize: true,
      layout: { background: { color: '#0D1218' }, textColor: '#9AA6B5', fontFamily: 'Inter, system-ui, sans-serif' },
      grid: { vertLines: { color: '#151C24' }, horzLines: { color: '#151C24' } },
      rightPriceScale: { borderColor: '#222B36' },
      timeScale: { borderColor: '#222B36', timeVisible: intraday, rightOffset: 6,
        tickMarkFormatter: (t, type) => tfmt(t, type === 0 ? { year: 'numeric' } : type === 1 ? { month: 'short' } : type === 2 ? { month: 'short', day: 'numeric' } : { hour: 'numeric', minute: '2-digit' }) },
      localization: { timeFormatter: (t) => tfmt(t, intraday ? { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' } : { month: 'short', day: 'numeric', year: 'numeric' }) },
      crosshair: { mode: LC.CrosshairMode.Normal },
    });
    const ser = chart.addCandlestickSeries({ upColor: '#26A69A', downColor: '#EF5350', borderVisible: false, wickUpColor: '#26A69A', wickDownColor: '#EF5350' });
    ser.setData(s.candles.map(([t, o, h, l, c]) => ({ time: t, open: o, high: h, low: l, close: c })));
    const acc = s.side === 'accumulation', r = s.range, L = LC.LineStyle;
    const pl = (price, color, style, title, width) => price != null && ser.createPriceLine({ price, color, lineWidth: width || 1, lineStyle: style, axisLabelVisible: true, title });
    pl(r.reaction, '#8FB4E0', L.Solid, acc ? 'range high' : 'range low', 2);
    pl(r.climax, '#8FB4E0', L.Solid, acc ? 'range low' : 'range high', 2);
    pl(r.eq, '#8A94A3', L.Dotted, 'EQ');
    pl(r.dev_limit, '#E06C6C', L.Dashed, 'dev limit');
    if (s.model === 'model1') pl(r.model1_limit, '#E06C6C', L.SparseDotted, 'M1 limit');
    if (s.zone) { pl(s.zone.hi, '#F5A524', L.Solid, `ext. ${acc ? 'demand' : 'supply'} (${s.zone.tf})`); pl(s.zone.lo, '#F5A524', L.Solid, ''); }
    if (s.liquidity) pl(s.liquidity.level, '#B48CF2', L.Dashed, `ext. liquidity (${s.liquidity.tf})`);
    if (s.stop != null && s.state === 'confirmed') pl(s.stop, '#E06C6C', L.Dotted, 'stop');
    const times = new Set(s.candles.map((c) => c[0]));
    const marks = s.markers.map((m) => ({ ...m, t: Math.floor(new Date(m.time) / 1000) })).filter((m) => times.has(m.t))
      .sort((a, b) => a.t - b.t).map((m) => {
        const below = m.kind === 'ar' ? !acc : acc;
        const col = m.kind === 'ar' ? '#8FB4E0' : m.kind === 'tap3' ? (s.state === 'failed' ? '#8A94A3' : '#F5A524') : '#F5A524';
        return { time: m.t, position: below ? 'belowBar' : 'aboveBar', color: col, shape: below ? 'arrowUp' : 'arrowDown', text: m.label };
      });
    ser.setMarkers(marks);
    chart.timeScale().fitContent();
  }

  // ------------------------------------------------------------ settings --
  const API = gh ? `https://api.github.com/repos/${owner}/${repo}` : null;
  let token = store.get('gh_token', '');
  let draft = null, sha = null, cfgState = 'idle', cfgError = '', dirty = false, adding = {};
  const UNI = { stocks: ['my list', 'most active 100', 'all US stocks'],
                crypto: ['my list', 'top 25', 'top 50', 'top 100', 'top 200', 'all USD pairs'] };
  const TZS = ['America/Los_Angeles', 'America/Denver', 'America/Chicago', 'America/New_York', 'UTC', 'Europe/London', 'Europe/Berlin', 'Asia/Tokyo', 'Australia/Sydney'];
  const T2 = { either: 'Closes 25% back in, or closes inside twice (either)', quarter: 'Closes 25% back into the range',
               two_closes: 'Closes inside the range twice in a row', close: 'Closes inside the range once' };
  const b64e = (str) => btoa(unescape(encodeURIComponent(str)));
  const b64d = (str) => decodeURIComponent(escape(atob(str.replace(/\n/g, ''))));
  const getp = (o, path) => path.split('.').reduce((x, k) => (x == null ? x : x[k]), o);
  const setp = (o, path, v) => { const ks = path.split('.'); const last = ks.pop(); ks.reduce((x, k) => x[k], o)[last] = v; };

  function toast(msg) {
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t); setTimeout(() => t.remove(), 4500);
  }

  async function gfetch(path, opts = {}) {
    return fetch(API + path, Object.assign({}, opts, { headers: Object.assign({
      Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }, opts.headers || {}) }));
  }

  // config.json written compactly: lists of names on one line
  function fmtConfig(c) {
    const out = JSON.stringify(c, null, 2);
    return out.replace(/\[\n\s+("[^"]*"(?:,\n\s+"[^"]*")*)\n\s+\]/g, (m, inner) => '[' + inner.replace(/,\n\s+/g, ', ') + ']') + '\n';
  }

  async function loadConfig() {
    cfgState = 'loading'; renderSettings();
    try {
      const r = await gfetch('/contents/config.json?ref=main');
      if (r.status === 401) throw new Error('GitHub didn’t accept this token. It may be mistyped or expired.');
      if (r.status === 404 || r.status === 403) throw new Error(`This token can’t see ${owner}/${repo}. Give it access to the repository with Contents: Read and write.`);
      if (!r.ok) throw new Error(`GitHub answered ${r.status}.`);
      const j = await r.json();
      sha = j.sha; draft = JSON.parse(b64d(j.content)); dirty = false; cfgState = 'ready'; cfgError = '';
    } catch (e) { cfgState = 'error'; cfgError = e.message || String(e); }
    renderSettings();
  }

  function validate(c) {
    const errs = [];
    for (const m of ['stocks', 'crypto']) {
      const x = c[m];
      if (!x.enabled) continue;
      if (!x.timeframes.length) errs.push(`${m === 'stocks' ? 'Stocks' : 'Crypto'}: pick at least one timeframe.`);
      const list = m === 'stocks' ? x.tickers : x.products;
      if (x.universe === 'my list' && !list.length) errs.push(`${m === 'stocks' ? 'Stocks' : 'Crypto'}: “my list” is empty.`);
    }
    const n = (v, lo, hi, name) => { if (!(Number.isInteger(v) && v >= lo && v <= hi)) errs.push(`${name} must be a whole number from ${lo} to ${hi}.`); };
    n(c.rules.trend_lookback ?? 50, 0, 500, 'Trend lookback');
    n(c.rules.max_opposite_deviations ?? 1, 0, 5, 'Deviations of the other end');
    n(c.alerts.max_bars_ago, 0, 100, 'Alert window');
    n(c.display.history_days, 1, 60, 'History days');
    return errs;
  }

  async function startScan() {
    const r = await gfetch('/actions/workflows/scan.yml/dispatches', { method: 'POST',
      headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ref: 'main', inputs: { markets: 'stocks,crypto' } }) });
    return r.status === 204;
  }

  async function saveConfig(scan) {
    const errs = validate(draft);
    const st = $('#savestatus');
    if (errs.length) { st.className = 'status err'; st.textContent = errs[0]; return; }
    st.className = 'status'; st.textContent = 'Saving…';
    try {
      const r = await gfetch('/contents/config.json', { method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: 'Update settings from the dashboard', content: b64e(fmtConfig(draft)), sha, branch: 'main' }) });
      if (r.status === 409 || r.status === 422) { st.className = 'status err'; st.textContent = 'Settings changed elsewhere. Reload settings and try again.'; return; }
      if (r.status === 403 || r.status === 404) { st.className = 'status err'; st.textContent = 'This token can read but not save. Give it Contents: Read and write.'; return; }
      if (!r.ok) throw new Error(`GitHub answered ${r.status}`);
      sha = (await r.json()).content.sha; dirty = false;
      st.className = 'status ok'; st.textContent = 'Saved. The next scan uses these settings.';
      if (scan) {
        const ok = await startScan();
        if (ok) setScanning(true);
        st.className = ok ? 'status ok' : 'status warn';
        st.textContent = ok ? 'Saved, and a scan has started. Results in a few minutes.' : 'Saved, but couldn’t start a scan: give the token Actions: Read and write.';
      }
      renderSettings(true);
    } catch (e) { st.className = 'status err'; st.textContent = 'Couldn’t save: ' + (e.message || e); }
  }

      ${cfgState === 'error' ? `<div class="status err" style="margin-top:10px">${esc(cfgError)}</div>` : ''}
      <ol class="steps">

  function tfChips(path) {
    const on = new Set(getp(draft, path));
    return `<div class="tags">${TF_ORDER.map((t) => `<button type="button" class="chip" data-tf="${path}" data-v="${t}" aria-pressed="${on.has(t)}">${t}</button>`).join('')}</div>`;
  }
  function sw(path, label, help) {
    return `<div class="fld"><div class="row"><div><div style="font-size:13px;font-weight:600">${label}</div>${help ? `<div class="help">${help}</div>` : ''}</div>
      <button type="button" class="sw" role="switch" aria-label="${esc(label)}" data-sw="${path}" aria-checked="${!!getp(draft, path)}"></button></div></div>`;
  }
  function selField(path, label, opts, names) {
    const v = getp(draft, path), id = 'f-' + path.replace(/\./g, '-');
    const all = opts.includes(v) ? opts : [v, ...opts];
    return `<div class="fld"><label for="${id}">${label}</label><select class="sel" id="${id}" data-sel="${path}">${all.map((o) =>
      `<option value="${esc(o)}"${o === v ? ' selected' : ''}>${esc(names ? names[o] || o : o)}</option>`).join('')}</select></div>`;
  }
  function numf(path, label, help, dflt) {
    const id = 'f-' + path.replace(/\./g, '-');
    return `<div class="fld"><div class="row"><div><label for="${id}" style="font-size:13px;font-weight:600">${label}</label>${help ? `<div class="help">${help}</div>` : ''}</div>
      <input id="${id}" class="inp num mono" type="number" min="0" step="1" data-num="${path}" value="${getp(draft, path) ?? dflt}"></div></div>`;
  }
  function listf(market, path, label, placeholder) {
    const xs = getp(draft, path) || [];
    const miss = (DATA.markets && DATA.markets[market] && DATA.markets[market].missing) || [];
    return `<div class="fld"><div class="lbl">${label} · ${xs.length}</div>
      <div class="tklist">${xs.map((x) => `<span class="tk"${miss.includes(x) ? ' style="border-color:#8A4B4B"' : ''}>${esc(x)}<button type="button" aria-label="Remove ${esc(x)}" data-rm="${path}" data-v="${esc(x)}">×</button></span>`).join('')}</div>
      ${miss.length ? `<div class="help" style="color:#F08C8C">Not found on the last scan: ${esc(miss.join(' '))}</div>` : ''}
      <div class="addrow"><label for="add-${market}" style="position:absolute;left:-9999px">Add to ${label}</label>
        <input id="add-${market}" class="inp mono" placeholder="${placeholder}" value="${esc(adding[market] || '')}" data-addin="${market}">
        <button type="button" class="btn" data-add="${path}" data-m="${market}">Add</button></div>
      <div class="help">Separate several with spaces or commas.</div></div>`;
  }

  function readonlySettings(c) {
    const kv = (k, v) => `<div class="kv"><span>${k}</span><span>${v}</span></div>`;
    const tags = (xs) => `<div class="tags">${xs.map((x) => `<span class="tag">${esc(x)}</span>`).join('')}</div>`;
    const yes = (b) => (b ? 'On' : 'Off');
    return `
      <div class="card"><h2>Stocks</h2>${kv('Scanning', c.stocks.enabled ? esc(c.stocks.universe) : 'Off')}${kv('Timeframes', esc(c.stocks.timeframes.join(' · ')))}
        <div class="muted" style="font-size:12px;margin-top:8px">My list · ${c.stocks.tickers.length} tickers</div>${tags(c.stocks.tickers)}</div>
      <div class="card"><h2>Crypto</h2>${kv('Scanning', c.crypto.enabled ? esc(c.crypto.universe) : 'Off')}${kv('Timeframes', esc(c.crypto.timeframes.join(' · ')))}
        <div class="muted" style="font-size:12px;margin-top:8px">My list · ${c.crypto.products.length} coins</div>${tags(c.crypto.products)}</div>
      <div class="card"><h2>Model rules</h2>${kv('Tap 2 is complete when price…', esc(T2[c.rules.tap2_return] || c.rules.tap2_return))}${kv('Require the AR to break structure', yes(c.rules.require_ar_break_of_structure))}${kv('Allow ranges inside larger ranges', yes(c.rules.allow_nested_ranges))}${kv('Tap 1 must close beyond every close of the last', (c.rules.trend_lookback ?? 50) + ' candles')}${kv('Deviations of the other end allowed', c.rules.max_opposite_deviations ?? 1)}</div>
      <div class="card"><h2>Phone alerts</h2>${kv('Tap 3 potential', yes(c.alerts.tap3_potential))}${kv('Tap 3 confirmed', yes(c.alerts.tap3_confirmed))}${kv('Model 1 forming', yes(c.alerts.model1_forming))}${kv('Only taps from the last', c.alerts.max_bars_ago + ' bars')}${kv('Time zone', esc(c.display.timezone))}</div>`;
  }

  function renderSettings(keepStatus) {
    $('#connect').innerHTML = connectCard();
    const g = $('#cfggrid');
    const editing = gh && token && cfgState === 'ready' && draft;
    $('#savebtn').hidden = $('#savescan').hidden = !editing;
    if (!keepStatus) { const st = $('#savestatus'); st.className = dirty ? 'status warn' : 'status'; st.textContent = dirty ? 'Unsaved changes' : ''; }
    if (gh && token && cfgState === 'idle') { loadConfig(); return; }
    if (cfgState === 'loading') { g.innerHTML = '<div class="card empty">Loading your settings from GitHub…</div>'; return; }
    if (!editing) {
      g.innerHTML = DATA.config ? readonlySettings(DATA.config) : '<div class="card empty">Settings appear after the first scan.</div>';
      bindConnect(); return;
    }
    const d = draft;
    d.rules.trend_lookback = d.rules.trend_lookback ?? 50;
    d.rules.max_opposite_deviations = d.rules.max_opposite_deviations ?? 1;
    g.innerHTML = `
      <div class="card"><h2>Stocks</h2><div class="muted" style="font-size:12px;margin-top:-6px">Alpaca free tier, ~15 min delayed · weekdays 9:00–17:00 New York</div>
        ${sw('stocks.enabled', 'Scan stocks')}
        ${selField('stocks.universe', 'What to scan', UNI.stocks)}
        ${listf('stocks', 'stocks.tickers', 'My list', 'AMD, NFLX…')}
        <div class="fld"><div class="lbl">Timeframes</div>${tfChips('stocks.timeframes')}</div></div>
      <div class="card"><h2>Crypto</h2><div class="muted" style="font-size:12px;margin-top:-6px">Coinbase spot, USD pairs · around the clock</div>
        ${sw('crypto.enabled', 'Scan crypto')}
        ${selField('crypto.universe', 'What to scan', UNI.crypto)}
        ${listf('crypto', 'crypto.products', 'My list', 'LINK, AVAX-USD…')}
        <div class="fld"><div class="lbl">Timeframes</div>${tfChips('crypto.timeframes')}</div></div>
      <div class="card"><h2>Model rules</h2>
        ${selField('rules.tap2_return', 'Tap 2 is complete when price…', Object.keys(T2), T2)}
        ${sw('rules.require_ar_break_of_structure', 'Require the AR to break structure', 'Off: keep these ranges and flag them')}
        ${sw('rules.allow_nested_ranges', 'Allow ranges inside larger ranges', 'On: keep them and flag them')}
        ${numf('rules.trend_lookback', 'Trend lookback (candles)', 'Tap 1 must close beyond every close of this many candles. 0 turns it off.', 50)}
        ${numf('rules.max_opposite_deviations', 'Deviations of the other end allowed', 'Before tap 3. One = red flag only; more ignores the setup. 0 = the other end must stay fresh.', 1)}</div>
      <div class="card"><h2>Phone alerts</h2>
        ${sw('alerts.tap3_potential', 'Tap 3 potential', 'An extreme level or zone was hit')}
        ${sw('alerts.tap3_confirmed', 'Tap 3 confirmed', 'Structure broke after the tap')}
        ${sw('alerts.model1_forming', 'Model 1 forming', 'Price is deviating the tap 2 extreme')}
        ${numf('alerts.max_bars_ago', 'Only alert for taps from the last (candles)', '', 5)}
        ${selField('display.timezone', 'Time zone', TZS)}
        ${numf('display.history_days', 'Days of history in “All setups”', '', 14)}
        <div class="fld"><button type="button" class="btn ghost" id="disconnect">Disconnect this browser</button></div></div>`;
    bindEditing();
  }

  function changed() { dirty = true; renderSettings(); }

  function bindConnect() {
    const b = $('#tokbtn');
    if (!b) return;
    const go = () => { const v = $('#tokin').value.trim(); if (!v) return; token = v; store.set('gh_token', v); cfgState = 'idle'; renderSettings(); };
    b.onclick = go; $('#tokin').onkeydown = (e) => { if (e.key === 'Enter') go(); };
  }

  function bindEditing() {
    const g = $('#cfggrid');
    g.querySelectorAll('[data-sw]').forEach((el) => el.onclick = () => { setp(draft, el.dataset.sw, !getp(draft, el.dataset.sw)); changed(); });
    g.querySelectorAll('[data-sel]').forEach((el) => el.onchange = () => { setp(draft, el.dataset.sel, el.value); changed(); });
    g.querySelectorAll('[data-num]').forEach((el) => el.onchange = () => { setp(draft, el.dataset.num, parseInt(el.value, 10)); changed(); });
    g.querySelectorAll('[data-tf]').forEach((el) => el.onclick = () => {
      const cur = new Set(getp(draft, el.dataset.tf)); cur.has(el.dataset.v) ? cur.delete(el.dataset.v) : cur.add(el.dataset.v);
      setp(draft, el.dataset.tf, TF_ORDER.filter((t) => cur.has(t))); changed(); });
    g.querySelectorAll('[data-rm]').forEach((el) => el.onclick = () => {
      setp(draft, el.dataset.rm, getp(draft, el.dataset.rm).filter((x) => x !== el.dataset.v)); changed(); });
    g.querySelectorAll('[data-addin]').forEach((el) => {
      el.oninput = () => { adding[el.dataset.addin] = el.value; };
      el.onkeydown = (e) => { if (e.key === 'Enter') g.querySelector(`[data-add][data-m="${el.dataset.addin}"]`).click(); };
    });
    g.querySelectorAll('[data-add]').forEach((el) => el.onclick = () => {
      const m = el.dataset.m, raw = (adding[m] || '').toUpperCase().split(/[\s,]+/).filter(Boolean);
      const norm = raw.map((x) => m === 'crypto' && !x.includes('-') ? x + '-USD' : x).filter((x) => /^[A-Z0-9.\-]{1,20}$/.test(x));
      const cur = getp(draft, el.dataset.add);
      setp(draft, el.dataset.add, cur.concat(norm.filter((x) => !cur.includes(x))));
      adding[m] = ''; changed();
      const inp = $(`#add-${m}`); if (inp) inp.focus();
    });
    const dc = $('#disconnect');
    if (dc) dc.onclick = () => { if (dirty && !confirm('Discard unsaved changes?')) return;
      token = ''; store.set('gh_token', ''); draft = null; sha = null; cfgState = 'idle'; dirty = false; renderSettings(); };
  }

  $('#savebtn').onclick = () => saveConfig(false);
  $('#savescan').onclick = () => saveConfig(true);
  window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
  $('#scannow').addEventListener('click', async (e) => {
    if (!token || !API) return;               // no token: the link opens GitHub's Run workflow page
    e.preventDefault();
    try {
      const ok = await startScan();
      toast(ok ? 'Scan started. Results in a few minutes.' : 'Couldn’t start a scan: the token needs Actions: Read and write.');
      if (ok) setScanning(true);
    }
    catch (err) { toast('Couldn’t start a scan.'); }
  });

  window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
  let wide = window.innerWidth > 820;
  window.addEventListener('resize', () => { const w = window.innerWidth > 820; if (w !== wide && DATA) { wide = w; render(); } });
  load().then(schedule);
})();
</script>
</body>
</html>
