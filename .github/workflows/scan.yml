name: Scan

on:
  schedule:
    - cron: "*/30 * * * *"          # every 30 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:                 # the "Run workflow" button = Scan now
    inputs:
      markets:
        description: "Markets to scan"
        required: false
        default: "stocks,crypto"

permissions:
  contents: write                    # lets the scan save its results to the repository

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Check the automatic-scans switch
        id: mode
        run: |
          auto=$(python3 -c "import json; print(str(json.load(open('config.json')).get('schedule', {}).get('automatic', True)).lower())")
          echo "auto=$auto" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$auto" != "true" ]; then
            echo "Automatic scans are off in settings; skipping this scheduled run."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.mode.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.mode.outputs.run == 'true'

      - name: Restore downloaded candles
        if: steps.mode.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: .bar_cache
          key: bars-${{ github.run_id }}
          restore-keys: bars-

      - name: Scan
        if: steps.mode.outputs.run == 'true'
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SCAN_MARKETS: ${{ github.event.inputs.markets }}
        run: python scan.py

      - name: Save results
        if: steps.mode.outputs.run == 'true'
        run: |
          git config user.name "tap-scanner-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/signals.json state/pushed.json
          git diff --cached --quiet || git commit -m "scan $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push
